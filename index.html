<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Particle Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: lobby + round-by-round bracket on one page grid; a match is a question card beside a paddle panel, then a black 4:3 Pong field */
:root{
  --bg:#ECF0F6; --surface:#FFFFFF; --surface2:#F4F6FA; --ink:#121A2C; --muted:#586379; --line:#D1D8E4;
  --red:#CF3F2C; --red-soft:#FBE4DF; --blue:#2C5CD3; --blue-soft:#DFE7FB;
  --good:#16884B; --good-soft:#D8F1E2; --gold:#B87C06; --ballline:rgba(18,26,44,.35);
  --field:#000000; --fieldInk:#FFFFFF;
  --display:'Bricolage Grotesque','IBM Plex Sans KR',system-ui,sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#172034; --surface2:#1E2842; --ink:#E8EDF7; --muted:#98A3BB; --line:#2C3854;
  --red:#FF6C58; --red-soft:#3A2024; --blue:#6B96FF; --blue-soft:#1D2B50;
  --good:#3ED08B; --good-soft:#15362A; --gold:#F4BD3E; --ballline:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#172034; --surface2:#1E2842; --ink:#E8EDF7; --muted:#98A3BB; --line:#2C3854;
  --red:#FF6C58; --red-soft:#3A2024; --blue:#6B96FF; --blue-soft:#1D2B50;
  --good:#3ED08B; --good-soft:#15362A; --gold:#F4BD3E; --ballline:rgba(0,0,0,.55); color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.joinf{display:flex;flex-direction:column;gap:6px}
.joinf label{font-weight:600}
.joinrow{display:flex;gap:10px;flex-wrap:wrap}
.joinrow input{font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);flex:1 1 200px;min-width:0}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--surface2);border-radius:10px}
.linkbox code{font-family:var(--mono);font-size:14px;overflow-wrap:anywhere;flex:1 1 200px;min-width:0}
.setup ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
#app{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
.ko{font-family:var(--body);font-weight:500;color:var(--muted)}
.eyebrow{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
kbd{font-family:var(--mono);font-size:.8em;padding:1px 6px;border:1px solid currentColor;border-radius:5px;opacity:.75}
.fx{font-family:var(--display);font-weight:700;white-space:nowrap}
.fx sub,.fx sup{font-size:.58em;line-height:0}
.fx sub{vertical-align:-.28em}.fx sup{vertical-align:.62em}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.big{padding:16px 22px;font-size:18px}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.ghost{background:transparent}

/* ---------- page frame ---------- */
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand svg{width:92px;height:auto;flex:none}
.brand h1{font-size:clamp(30px,4.4vw,46px);font-weight:800;letter-spacing:-.02em}
.brand p{color:var(--muted);font-weight:500}
.me{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 18px;min-width:0}
.me img{width:34px;height:34px;border-radius:50%;flex:none}
.me span{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.me b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:20px;font-weight:700;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.panel h2 .ko{font-size:15px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.note{font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}

/* status band */
.status{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px 24px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.status.go{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.status.gold{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.status h2{font-size:clamp(22px,3vw,30px);font-weight:800}
.status p{color:var(--muted);margin-top:4px}
.status .acts{display:flex;gap:8px;flex-wrap:wrap}

/* lobby */
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-weight:600;max-width:100%}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.me{border-color:var(--ink)}
.pchip button{border:0;background:none;padding:0 2px;color:var(--muted);font-size:17px;line-height:1}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.types{grid-template-columns:minmax(0,1fr)}}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.chk input{margin-top:4px;accent-color:var(--ink);width:16px;height:16px}
.chk span{display:flex;flex-direction:column;line-height:1.3}
.chk b{font-size:15px}.chk small{color:var(--muted);font-size:13px}
.setrow{display:flex;flex-direction:column;gap:6px}
.setrow .lbl{font-size:14px;font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg span{display:block;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;cursor:pointer}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.plan{font-family:var(--mono);font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface2)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.q{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.pill.p{background:var(--red-soft);color:var(--red);border-color:transparent}
.pill.d{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

/* live matches */
.live{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lm{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);min-width:0}
.lm .vsl{font-family:var(--display);font-weight:700;font-size:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;min-width:0}
.lm .vsl em{font-style:normal;color:var(--muted);font-size:14px;font-weight:500}
.lm .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.lm .sub{font-size:13px;color:var(--muted)}
.award{display:flex;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}

/* bracket */
.bracket-scroll{overflow-x:auto;padding-bottom:6px}
.bracket{display:flex;gap:24px;min-width:max-content;align-items:stretch}
.round{display:flex;flex-direction:column;gap:12px;width:220px}
.round h3{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;flex-direction:column}
.round h3 span{font-family:var(--body);letter-spacing:0;text-transform:none;font-size:13px}
.round-body{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.mc{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;text-align:left;padding:0;width:100%}
.mc .r{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;font-weight:500;min-width:0}
.mc .r+.r{border-top:1px solid var(--line)}
.mc .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .r .sc{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.mc .r.win{font-weight:700}
.mc .r.win .sc{color:var(--good)}
.mc .r.lose{color:var(--muted)}
.mc .r.lose span:first-child{text-decoration:line-through}
.mc .r.mine span:first-child::after{content:" · you";font-family:var(--mono);font-size:11px;color:var(--muted)}
.standings{display:flex;flex-direction:column;gap:6px}
@media (min-width:861px){.grid2.sr{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}}
.mc.st .r{padding:8px 12px}
.mc.st .sc b{color:var(--ink)}
.glab{font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.round-body.rb-top{justify-content:flex-start}
.mc .foot{padding:5px 12px;border-top:1px solid var(--line);background:var(--surface2);display:flex;justify-content:space-between;align-items:center;gap:6px}
button.mc:hover{border-color:var(--muted)}
.mc.bye .r{color:var(--muted);font-style:italic}

/* champion */
.tile{width:min(240px,100%);aspect-ratio:1/1.08;box-sizing:border-box;border:3px solid var(--gold);border-radius:20px;background:var(--surface);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:18px;flex:none}
.tile .tz{position:absolute;top:12px;left:16px;font-family:var(--mono);font-size:20px;font-weight:600;color:var(--gold)}
.tile .tsym{font-family:var(--display);font-weight:800;font-size:84px;line-height:1;color:var(--gold)}
.tile .tname{font-family:var(--display);font-weight:800;font-size:22px;text-align:center;overflow-wrap:anywhere;line-height:1.1}
.champ{display:flex;gap:24px;align-items:center;flex-wrap:wrap}

/* how to play */
.how ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.how li span{display:block;color:var(--muted);font-size:14px}
details.panel{display:block}
details.panel>*+*{margin-top:12px}
details.how summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:20px}
details.how[open] summary{margin-bottom:12px}

/* ---------- match screens ---------- */
.mwrap{max-width:1240px;margin:0 auto;padding-block:16px 28px;display:flex;flex-direction:column;gap:16px}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vs{font-size:clamp(24px,3.4vw,36px);font-weight:800;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;min-width:0}
.vs .l{color:var(--red)}.vs .r{color:var(--blue)}
.vs em{font-style:normal;font-size:.55em;color:var(--muted);font-weight:600}
.vs small,.you{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.quiz{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:860px){.quiz{grid-template-columns:minmax(0,1fr)}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.qtop{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tnum{font-family:var(--display);font-size:30px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0;line-height:1}
.tnum.low{color:var(--red)}
.tbar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.tbar i{display:block;height:100%;background:var(--ink);transform-origin:left center}
.tbar.low i{background:var(--red)}
.prompt{font-size:clamp(22px,2.6vw,32px);font-weight:800;text-align:center}
.prompt-ko{margin-top:-6px;text-align:center;font-size:clamp(15px,1.6vw,20px);color:var(--muted);font-weight:500}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:150px}
.big{font-size:clamp(52px,8vw,104px);line-height:1}
.big .fx{font-weight:800}
.chips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 18px;display:flex;flex-direction:column;align-items:center;min-width:110px}
.chip small{font-size:13px;color:var(--muted);font-weight:500}
.chip b{font-family:var(--display);font-size:clamp(34px,5vw,58px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.formrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.formrow .arrow-t{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,34px);color:var(--muted);white-space:nowrap}
.formrow .q{color:var(--muted)}
.hunt{font-family:var(--display);font-weight:800;font-size:clamp(44px,7vw,92px);letter-spacing:-.02em;line-height:1}
.hunt small{display:block;font-family:var(--body);font-size:.32em;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.model{width:min(100%,360px);height:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:13px;height:13px;border-radius:50%;display:inline-block;border:1px solid var(--ballline)}
.qopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.qopts{grid-template-columns:minmax(0,1fr)}}
.qopt{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);font-size:clamp(20px,2.2vw,28px);text-align:left;min-width:0}
.qopt:hover:not(:disabled){border-color:var(--muted)}
.qopt:disabled{cursor:default;opacity:1}
.qopt .k{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:15px;font-weight:600;background:var(--ink);color:var(--bg)}
.qopt .lab{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.opt-en{font-family:var(--display);font-weight:700}
.opt-ko{font-size:.55em;color:var(--muted);font-weight:500}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.qopt.right{background:var(--good-soft);border-color:var(--good)}
.qopt.wrong{border-color:var(--red);text-decoration:line-through;animation:shake .35s}
.qopt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.fb .v{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.4vw,28px)}
.fb .v.ok{color:var(--good)}.fb .v.no{color:var(--red)}
.fb .ex{max-width:62ch;font-size:16px}
.fb .ex .ko{display:block;font-size:.92em;margin-top:2px}
.waitbox{align-items:center;text-align:center;padding-block:36px}
.waitbox h3{font-size:clamp(26px,3.4vw,40px);font-weight:800}

/* paddle panel */
.pads{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.pads h3{font-size:18px;font-weight:700}
.pads-row{display:flex;gap:14px;justify-content:center}
.pp{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;flex:1;max-width:130px}
.pp-field{position:relative;width:100%;aspect-ratio:3/4;background:var(--field);border-radius:8px;overflow:hidden}
.pp-net{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:repeating-linear-gradient(var(--fieldInk) 0 8px,transparent 8px 16px);opacity:.45}
.pp-pad{position:absolute;top:50%;width:8px;height:var(--h);background:var(--fieldInk);transform:translateY(-50%);transition:height .9s cubic-bezier(.34,1.56,.64,1)}
.pp-pad.l{left:12px}.pp-pad.r{right:12px}
.pp-pop{position:absolute;left:0;right:0;top:10px;text-align:center;font-family:var(--mono);font-weight:600;font-size:15px;color:var(--fieldInk);opacity:0;pointer-events:none}
.pp-pop.go{animation:pop 1.4s ease-out}
.pp-field.flash{animation:flash .9s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(12px)}20%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--good)}100%{box-shadow:0 0 0 0 transparent}}
.pp-lab{display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:0;max-width:100%}
.pp-lab b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pp-lab .pct{font-family:var(--mono);font-size:14px;color:var(--muted)}
.pp.L .pp-lab b{color:var(--red)}.pp.R .pp-lab b{color:var(--blue)}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.dots i.ok{background:var(--good);border-color:var(--good)}
.dots i.no{background:var(--red);border-color:var(--red)}

/* pong */
.pbar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.pn{font-family:var(--display);font-weight:800;font-size:clamp(18px,2.4vw,28px);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn.L{color:var(--red)}.pn.R{color:var(--blue);text-align:right}
.pmid{display:flex;gap:8px;align-items:center}
.pongs{display:grid;gap:14px;align-items:center;grid-template-columns:auto minmax(0,1fr)}
.pongs.right{grid-template-columns:minmax(0,1fr) auto}
.pongs.right .ctrl{order:2}
.pongs.watch{grid-template-columns:minmax(0,1fr)}
.cvwrap{position:relative;display:flex;justify-content:center;min-width:0}
.cvbox{position:relative}
#cv{display:block;background:var(--field);border-radius:4px;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%}
.cvmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--fieldInk);font-family:var(--mono);font-size:17px;text-align:center;padding:24px;pointer-events:none}
.cvmsg:empty{display:none}
.cvmsg span{background:var(--field);padding:6px 12px}
.ctrl{display:flex;flex-direction:column;gap:12px}
.arrow{width:clamp(88px,11vw,130px);height:clamp(110px,24vh,210px);border-radius:18px;border:2px solid var(--line);background:var(--surface);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:grid;place-items:center;padding:0}
.arrow svg{width:44%;height:auto;fill:currentColor;pointer-events:none}
.arrow.held{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.phint{text-align:center;font-size:14px;color:var(--muted)}
@media (max-width:720px), (orientation:portrait) and (max-width:1000px){
  .pongs,.pongs.right{grid-template-columns:minmax(0,1fr)}
  .ctrl{flex-direction:row;justify-content:center;order:2}
  .arrow{height:96px;width:min(42vw,200px)}
}
.result{max-width:600px;width:100%;margin:4vh auto 0;align-items:center;text-align:center;padding:32px}
.result h2{font-size:clamp(32px,5vw,52px);font-weight:800}
.fscore{font-family:var(--mono);font-size:clamp(44px,7vw,72px);font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.fscore .l{color:var(--red)}.fscore .r{color:var(--blue)}
.result .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.switch{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:40;max-width:calc(100% - 32px);font-weight:600;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>

/* ================= seeded randomness ================= */
let RNG=Math.random;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function withSeed(seed,fn){const prev=RNG;RNG=mulberry(seed);try{return fn()}finally{RNG=prev}}
const rnd=a=>a[Math.floor(RNG()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const $=s=>document.querySelector(s);
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= chemistry data ================= */
const ZN={H:1,He:2,Li:3,Be:4,B:5,C:6,N:7,O:8,F:9,Ne:10,Na:11,Mg:12,Al:13,Si:14,P:15,S:16,Cl:17,Ar:18,K:19,Ca:20,Fe:26,Cu:29};
const SYM={};for(const k in ZN)SYM[ZN[k]]=k;
const EN={H:'hydrogen',He:'helium',Li:'lithium',Be:'beryllium',B:'boron',C:'carbon',N:'nitrogen',O:'oxygen',F:'fluorine',Ne:'neon',Na:'sodium',Mg:'magnesium',Al:'aluminum',Si:'silicon',P:'phosphorus',S:'sulfur',Cl:'chlorine',Ar:'argon',K:'potassium',Ca:'calcium',Fe:'iron',Cu:'copper'};
const KO={H:'수소',He:'헬륨',Li:'리튬',Be:'베릴륨',B:'붕소',C:'탄소',N:'질소',O:'산소',F:'플루오린',Ne:'네온',Na:'나트륨',Mg:'마그네슘',Al:'알루미늄',Si:'규소',P:'인',S:'황',Cl:'염소',Ar:'아르곤',K:'칼륨',Ca:'칼슘',Fe:'철',Cu:'구리'};
const ATOMS=['H','He','C','N','O','Ne','Na','Mg','Al','S','Cl','Ar','K','Ca','Fe','Cu'].map(f=>({f,c:0,kind:'atom',en:EN[f]+' atom',ko:KO[f]+' 원자'}));
const MOLS=[['H2','hydrogen','수소'],['O2','oxygen','산소'],['N2','nitrogen','질소'],['Cl2','chlorine','염소'],['H2O','water','물'],['CO2','carbon dioxide','이산화 탄소'],['NH3','ammonia','암모니아'],['CH4','methane','메테인'],['O3','ozone','오존'],['H2O2','hydrogen peroxide','과산화 수소'],['HCl','hydrogen chloride','염화 수소'],['CO','carbon monoxide','일산화 탄소'],['SO2','sulfur dioxide','이산화 황'],['C6H12O6','glucose','포도당']].map(([f,en,ko])=>({f,c:0,kind:'molecule',en,ko}));
const IONS=[['Li',1,'lithium ion','리튬 이온'],['Na',1,'sodium ion','나트륨 이온'],['K',1,'potassium ion','칼륨 이온'],['Mg',2,'magnesium ion','마그네슘 이온'],['Ca',2,'calcium ion','칼슘 이온'],['Al',3,'aluminum ion','알루미늄 이온'],['F',-1,'fluoride ion','플루오린화 이온'],['Cl',-1,'chloride ion','염화 이온'],['O',-2,'oxide ion','산화 이온'],['S',-2,'sulfide ion','황화 이온'],['Fe',3,'iron(III) ion','철(Ⅲ) 이온'],['Cu',2,'copper(II) ion','구리(Ⅱ) 이온'],['NH4',1,'ammonium ion','암모늄 이온'],['OH',-1,'hydroxide ion','수산화 이온'],['SO4',-2,'sulfate ion','황산 이온'],['CO3',-2,'carbonate ion','탄산 이온'],['NO3',-1,'nitrate ion','질산 이온']].map(([f,c,en,ko])=>({f,c,kind:'ion',en,ko}));
const MONO=IONS.filter(i=>i.f in ZN);
const RAD={H:13,C:21,N:21,O:21,Cl:26};
const MODELS={H2:[['H',89,60],['H',111,60]],O2:[['O',81,60],['O',119,60]],N2:[['N',81,60],['N',119,60]],Cl2:[['Cl',77,60],['Cl',123,60]],HCl:[['Cl',92,60],['H',123,60]],CO:[['C',81,60],['O',119,60]],H2O:[['O',100,54],['H',70,78],['H',130,78]],CO2:[['O',58,60],['O',142,60],['C',100,60]],NH3:[['H',70,74],['H',130,74],['N',100,56],['H',100,90]],CH4:[['H',100,28],['H',66,80],['H',134,80],['C',100,62],['H',100,96]],O3:[['O',64,74],['O',136,74],['O',100,52]]};
const BALL={H:'#E9ECF2',C:'#3A3E47',N:'#3E68E0',O:'#E2493A',Cl:'#3DB44A'};

function fmt(f,c=0){let h=f.replace(/(\d+)/g,'<sub>$1</sub>');if(c){const m=Math.abs(c);h+=`<sup>${m>1?m:''}${c>0?'+':'−'}</sup>`}return `<span class="fx">${h}</span>`}
function countAtoms(f){const o={};f.replace(/([A-Z][a-z]?)(\d*)/g,(_,e,n)=>{o[e]=(o[e]||0)+(n?+n:1)});return o}
const total=f=>Object.values(countAtoms(f)).reduce((a,b)=>a+b,0);
const sgn=c=>c>0?'+'+c:c<0?'−'+Math.abs(c):'0';
const KOK=t=>`<span class="ko">${t}</span>`;
function mk(correct,ds,numeric){
  ds=uniq(ds.filter(d=>d!==correct));
  let opts=[correct,...shuffle(ds).slice(0,3)];
  if(numeric)opts.sort((a,b)=>a-b);else opts=shuffle(opts);
  return{options:opts.map(o=>numeric?`<span class="num">${o}</span>`:o),answer:opts.indexOf(correct)};
}
function modelSVG(k){let s=`<svg class="model" viewBox="0 0 200 120" role="img" aria-label="molecule model">`;for(const [el,x,y] of MODELS[k])s+=`<circle cx="${x}" cy="${y}" r="${RAD[el]}" fill="url(#g-${el})" stroke="var(--ballline)" stroke-width="1.2"/>`;return s+'</svg>'}

const TYPES={classify:['Atom, molecule or ion?','원자·분자·이온 구별'],count:['Count the atoms','원자 개수 세기'],pe:['Protons & electrons','양성자·전자로 입자 찾기'],electrons:['Electrons in an ion','이온의 전자 수'],form:['Ion maker','이온 만들기'],odd:['Find the one','골라내기'],model:['Ball models','분자 모형']};
const WEIGHT={classify:2,count:1,pe:1,electrons:1,form:1,odd:1,model:1};
const ALLTYPES=Object.fromEntries(Object.keys(TYPES).map(k=>[k,true]));

const GEN={
  classify(){
    const s=rnd([...ATOMS,...MOLS,...IONS]);
    const labels=[['atom','Atom','원자'],['molecule','Molecule','분자'],['ion','Ion','이온']];
    let why;
    if(s.kind==='atom')why=`One atom, no charge → atom.`+KOK('전하가 없는 원자 1개 → 원자');
    else if(s.kind==='molecule'){const n=total(s.f),one=Object.keys(countAtoms(s.f)).length===1;why=`${n} atoms bonded together, no charge${one?' (same element, still a molecule)':''} → molecule.`+KOK(`원자 ${n}개가 결합, 전하 없음${one?' (같은 원소여도 분자)':''} → 분자`)}
    else if(!(s.f in ZN))why=`Several atoms, but the whole group carries a charge → ion.`+KOK('여러 원자로 되어 있지만 전하를 띠므로 → 이온 (다원자 이온)');
    else why=`It carries a ${s.c>0?'positive':'negative'} charge → ion.`+KOK(`전하를 띠므로 → ${s.c>0?'양이온':'음이온'}`);
    return{key:'c'+s.f+s.c,prompt:'Atom, molecule, or ion?',ko:'원자, 분자, 이온 중 무엇일까?',stage:`<div class="big">${fmt(s.f,s.c)}</div>`,
      options:labels.map(l=>`<span class="opt-en">${l[1]}</span><span class="opt-ko">${l[2]}</span>`),answer:labels.findIndex(l=>l[0]===s.kind),
      explain:`<b>${fmt(s.f,s.c)}</b> ${s.en} (${s.ko}). ${why}`};
  },
  count(){
    const s=rnd([...MOLS,...IONS.filter(i=>!(i.f in ZN))]);
    const ca=countAtoms(s.f),n=total(s.f),distinct=Object.keys(ca).length;
    const digitSum=s.f.replace(/\D/g,'').split('').reduce((a,b)=>a+ +b,0);
    const {options,answer}=mk(n,[n-1,n+1,n+2,n-2,distinct,digitSum].filter(x=>x>0),true);
    const parts=Object.entries(ca).map(([e,k])=>`${e} ${k}`).join(' + ');
    return{key:'n'+s.f,prompt:'How many atoms are in one particle?',ko:'이 입자 1개에 들어 있는 원자는 모두 몇 개?',stage:`<div class="big">${fmt(s.f,s.c)}</div>`,options,answer,
      explain:`<b>${fmt(s.f,s.c)}</b> ${s.en}: ${parts} = <b>${n}</b> atoms.`+KOK(`${s.ko}: ${parts} = 원자 ${n}개`)};
  },
  pe(){
    let sym,c;
    if(RNG()<.75){const i=rnd(MONO.filter(i=>ZN[i.f]<=20));sym=i.f;c=i.c}
    else{sym=rnd(['H','He','C','N','O','F','Ne','Na','Mg','Al','S','Cl','Ar','K','Ca']);c=0}
    const p=ZN[sym],e=p-c,correct=fmt(sym,c),d=[];
    if(c){d.push(fmt(sym,0),fmt(sym,-c),fmt(sym,c>0?c+1:c-1));if(SYM[e]&&SYM[e]!==sym&&e<=20)d.push(fmt(SYM[e],0))}
    else{d.push(fmt(sym,1),fmt(sym,-1));if(SYM[p+1]&&p+1<=20)d.push(fmt(SYM[p+1],0));if(SYM[p-1])d.push(fmt(SYM[p-1],0))}
    const {options,answer}=mk(correct,d);
    return{key:'p'+sym+c,prompt:'Which particle is this?',ko:'이 입자는 무엇일까?',
      stage:`<div class="chips"><div class="chip"><small>Protons · 양성자</small><b>${p}</b></div><div class="chip"><small>Electrons · 전자</small><b>${e}</b></div></div>`,options,answer,
      explain:`${p} protons → ${EN[sym]} (${sym}). Charge = ${p} − ${e} = ${sgn(c)} → <b>${correct}</b>${c?'':' (neutral atom)'}`+KOK(`양성자 ${p}개 → ${KO[sym]}. 전하 = ${p} − ${e} = ${sgn(c)} → ${c?(c>0?'양이온':'음이온'):'중성 원자'}`)};
  },
  electrons(){
    const i=rnd(MONO),p=ZN[i.f],e=p-i.c,m=Math.abs(i.c);
    const {options,answer}=mk(e,[p,p+i.c,e+1,e-1,e+2].filter(x=>x>=0),true);
    return{key:'e'+i.f,prompt:'How many electrons does this ion have?',ko:'이 이온의 전자는 몇 개일까?',stage:`<div class="big">${fmt(i.f,i.c)}</div>`,options,answer,
      explain:`A ${EN[i.f]} atom has ${p} electrons. It ${i.c>0?'loses':'gains'} ${m} → <b>${e}</b>.`+KOK(`${KO[i.f]} 원자의 전자 ${p}개에서 ${m}개를 ${i.c>0?'잃어':'얻어'} → ${e}개`)};
  },
  form(){
    const i=rnd(MONO),m=Math.abs(i.c),lose=i.c>0;
    const d=[fmt(i.f,-i.c),fmt(i.f,0),fmt(i.f,lose?i.c+1:i.c-1)];if(m>1)d.push(fmt(i.f,lose?i.c-1:i.c+1));
    const {options,answer}=mk(fmt(i.f,i.c),d);
    const cap=EN[i.f][0].toUpperCase()+EN[i.f].slice(1);
    return{key:'f'+i.f+i.c,prompt:`${cap} atom ${lose?'loses':'gains'} ${m} electron${m>1?'s':''}. What forms?`,ko:`${KO[i.f]} 원자가 전자 ${m}개를 ${lose?'잃으면':'얻으면'}?`,
      stage:`<div class="formrow"><span class="big">${fmt(i.f)}</span><span class="arrow-t">${lose?'−':'+'} ${m}e<sup>−</sup> →</span><span class="big q">?</span></div>`,options,answer,
      explain:lose?`Losing electrons leaves more protons than electrons → positive ion (cation): <b>${fmt(i.f,i.c)}</b>.`+KOK('전자를 잃으면 양성자가 더 많아져 → 양이온')
                  :`Gaining electrons gives more electrons than protons → negative ion (anion): <b>${fmt(i.f,i.c)}</b>.`+KOK('전자를 얻으면 전자가 더 많아져 → 음이온')};
  },
  odd(){
    const kinds=[['molecule',MOLS,'MOLECULE','분자를 찾아라!','분자','Bonded atoms with no charge.','원자가 결합, 전하 없음'],['ion',IONS,'ION','이온을 찾아라!','이온','It has a + or − charge.','+ 또는 − 전하가 있음'],['atom',ATOMS,'ATOM','원자를 찾아라!','원자','One atom with no charge.','원자 1개, 전하 없음']];
    const t=rnd(kinds),target=rnd(t[1]);
    const others=shuffle([...ATOMS,...MOLS,...IONS].filter(s=>s.kind!==t[0])).slice(0,3);
    const {options,answer}=mk(fmt(target.f,target.c),others.map(s=>fmt(s.f,s.c)));
    return{key:'o'+t[0]+target.f+target.c,prompt:`Which one is ${t[0]==='molecule'?'a':'an'} ${t[0]}?`,ko:t[3],stage:`<div class="hunt">${t[2]}<small>${t[4]}</small></div>`,options,answer,
      explain:`<b>${fmt(target.f,target.c)}</b> ${target.en}. ${t[5]}`+KOK(`${target.ko}: ${t[6]}`)};
  },
  model(){
    const keys=Object.keys(MODELS),k=rnd(keys);
    const {options,answer}=mk(fmt(k),shuffle(keys.filter(x=>x!==k)).map(x=>fmt(x)));
    const mol=MOLS.find(m=>m.f===k),ca=countAtoms(k);
    return{key:'m'+k,prompt:'Which formula matches this model?',ko:'이 모형에 맞는 화학식은?',
      stage:modelSVG(k)+`<div class="legend">${['H','C','N','O','Cl'].map(e=>`<span><i style="background:${BALL[e]}"></i>${e}</span>`).join('')}</div>`,options,answer,
      explain:`${Object.entries(ca).map(([e,n])=>`${n} ${e}`).join(', ')} → <b>${fmt(k)}</b> ${mol.en}.`+KOK(`${mol.ko}: ${Object.entries(ca).map(([e,n])=>`${KO[e]} ${n}`).join(', ')}`)};
  }
};
function genQuestion(types,used){
  const en=Object.keys(TYPES).filter(k=>types&&types[k]);if(!en.length)en.push('classify');
  const bag=[];en.forEach(k=>{for(let i=0;i<WEIGHT[k];i++)bag.push(k)});
  let q;for(let t=0;t<30;t++){const type=rnd(bag);q=GEN[type]();q.type=type;if(!used||!used.has(q.key))break}
  if(used)used.add(q.key);return q;
}
function quizFor(m){return withSeed(hashStr('q:'+m.id),()=>{const used=new Set();return [0,1,2].map(()=>genQuestion(m.types||ALLTYPES,used))})}

/* ================= constants ================= */
const QN=3,BASE=32,BONUS_PCT=40,BONUS=BASE*BONUS_PCT/100,PFIELD=300;
const BTXT='+'+BONUS_PCT+'%',BMAX='+'+BONUS_PCT*QN+'%';
const WIN_OPTS=[5,7,11,15,21],QT_OPTS=[10,15,20,30,45,60];
const gWin=()=>(D.game&&D.game.win)||11,gQt=()=>(D.game&&D.game.qtime)||20;
const padPct=c=>Math.round((BASE+BONUS*c)/BASE*100);
const lenPct=c=>((BASE+BONUS*c)/PFIELD*100).toFixed(1);
const qid=(mid,uid)=>mid+'~'+uid;

/* ================= sound ================= */
let AC=null,MUTED=false;
try{MUTED=localStorage.getItem('pd-muted')==='1'}catch(e){}
function ensureAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
document.addEventListener('pointerdown',ensureAudio,{passive:true});
document.addEventListener('keydown',ensureAudio);
function beep(f,d,type='square',vol=.12){if(MUTED||!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.setValueAtTime(vol,t+d);g.gain.linearRampToValueAtTime(0,t+d+.01);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={paddle:()=>beep(459,.05),wall:()=>beep(226,.03),point:()=>beep(490,.26),good:()=>{beep(660,.08,'sine',.18);setTimeout(()=>beep(880,.12,'sine',.18),90)},bad:()=>beep(170,.18,'square',.08)};

const C={ready:false,db:null,uid:null,isHost:false,wantHost:new URLSearchParams(location.search).has('host'),setup:false,fail:null};

function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>{t.hidden=true},4200)}

const writers={};
function writeDoc(path,data,mode='set'){
  if(!C.db)return Promise.resolve();
  const w=writers[path]||(writers[path]={busy:false,next:null,p:null});
  if(w.next&&w.next.mode==='update'&&mode==='update')w.next={mode,data:{...w.next.data,...data}};else w.next={mode,data};
  if(w.busy)return w.p;
  w.busy=true;
  w.p=(async()=>{while(w.next){const {mode,data}=w.next;w.next=null;try{const ref=C.db.ref(path);if(mode==='update')await ref.update(data);else await ref.set(data)}catch(e){toast('Couldn’t save. Check the connection. · 저장하지 못했습니다.')}}w.busy=false})();
  return w.p;
}

async function boot(){
  renderHome();
  if(!FIREBASE_CONFIG.apiKey||!FIREBASE_CONFIG.databaseURL){C.setup=true;C.ready=true;renderHome();return}
  if(typeof firebase==='undefined'){C.fail='The Firebase library didn’t load. Check the internet connection. · Firebase를 불러오지 못했습니다.';C.ready=true;renderHome();return}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const cred=await firebase.auth().signInAnonymously();
    C.uid=((cred&&cred.user)||firebase.auth().currentUser).uid;
    C.db=firebase.database();
  }catch(e){C.fail=(e&&(e.code||e.message))||'unknown error';C.ready=true;renderHome();return}
  C.ready=true;subscribeAll();renderHome();
}
function subscribeAll(){
  const t=setTimeout(()=>{D.slow=true;if(!D.gameLoaded)renderHome()},10000);
  const on=(path,cb)=>C.db.ref(path).on('value',s=>{cb(s.val());onData()},e=>{D.err=(e&&e.code)||'error';D.gameLoaded=D.hostLoaded=true;clearTimeout(t);onData()});
  C.db.ref('.info/serverTimeOffset').on('value',s=>{C.off=+s.val()||0});
  on('host',v=>{D.host=typeof v==='string'?v:null;D.hostLoaded=true;C.isHost=!!C.uid&&D.host===C.uid});
  on('game',v=>{clearTimeout(t);D.slow=false;D.game=v&&typeof v==='object'?v:null;D.gameLoaded=true;D.tid=(D.game&&D.game.tid)||null;recompute()});
  on('players',v=>{D.playersAll=v&&typeof v==='object'?v:{};recompute()});
  on('matches',v=>{D.matchesAll=v&&typeof v==='object'?v:{};D.matchesLoaded=true;recompute()});
  on('quiz',v=>{D.quizAll=v&&typeof v==='object'?v:{};D.quizLoaded=true;recompute()});
}
function recompute(){
  const tid=D.tid;
  D.players=Object.entries(D.playersAll).filter(([,p])=>p&&p.tid===tid).map(([uid,p])=>({uid,...p})).sort((x,y)=>(x.at||0)-(y.at||0));
  const ms={};for(const [id,m] of Object.entries(D.matchesAll))if(m&&m.tid===tid)ms[id]={id,...m};D.matches=ms;
  const qz={};for(const [k,q] of Object.entries(D.quizAll))if(q&&q.tid===tid)qz[k]=q;D.quiz=qz;
}
/* Live match channel: each player writes live/<match>/<side> about 20 times a second; it is removed on disconnect. */
function liveRoom(mid){
  const base=C.db.ref('live/'+mid),peers={},offs=[],watching=new Set();
  let mine=null,lastSent='',timer=0,lastAt=0,dcSide=null,left=false;
  function flush(){
    timer=0;lastAt=Date.now();if(left||!mine||(mine.side!==0&&mine.side!==1))return;
    const s=JSON.stringify(mine);if(s===lastSent)return;lastSent=s;
    const r=base.child(String(mine.side));
    if(dcSide!==mine.side){dcSide=mine.side;try{r.onDisconnect().remove()}catch(e){}}
    r.set(JSON.parse(s)).catch(()=>{});
  }
  return{
    watch(sides){for(const sd of sides){if(watching.has(sd))continue;watching.add(sd);const r=base.child(String(sd));const f=r.on('value',snap=>{const v=snap.val();if(v&&typeof v==='object')peers[sd]={by:v.uid||null,isMe:v.uid===C.uid,sameTab:false,presence:v,updatedAt:Date.now()};else delete peers[sd]});offs.push(()=>r.off('value',f))}},
    peers:()=>Object.values(peers),
    presence(patch){if(left)return Promise.resolve();const n={...(mine||{})};for(const k in patch){if(patch[k]===null)delete n[k];else n[k]=patch[k]}mine=n;const now=Date.now();if(now-lastAt>=30)flush();else if(!timer)timer=setTimeout(flush,30-(now-lastAt));return Promise.resolve()},
    leave(){left=true;clearTimeout(timer);offs.forEach(f=>f());if(dcSide!==null)base.child(String(dcSide)).remove().catch(()=>{});return Promise.resolve()}
  };
}

let dataPending=false;
function onData(){if(dataPending)return;dataPending=true;setTimeout(()=>{dataPending=false;handleData()},30)}
function handleData(){
  refreshNames();
  if(C.isHost)hostAdvance();
  const mine=myActiveMatch();
  if(mine&&!(MV&&MV.mid===mine.id&&MV.side>=0)){
    if(MV&&MV.screen==='result'&&Date.now()-MV.resultAt<5000){setTimeout(onData,5100-(Date.now()-MV.resultAt))}
    else{openMatch(mine.id,false);return}
  }
  if(MV){matchUpdate();return}
  const bw=byeAutoWatch();if(bw){openMatch(bw,true);return}
  renderHome();
}

/* ================= tournament logic =================
   Placement tournament. A group of players competes for places lo..lo+n-1. Its players are paired
   (one bye if odd); winners (and the bye) form a group for the top places, losers a group for the
   bottom places. A group of one gets its final place. With ranking matches off, the losers' group
   is not played and its players share the place lo. */
function phaseOf(m){
  if(m.w!=null)return 'done';
  const qa=D.quiz[qid(m.id,m.a)],qb=D.quiz[qid(m.id,m.b)];
  if(m.status==='pong'||(qa&&qa.done&&qb&&qb.done))return 'pong';
  return 'quiz';
}
const rankOn=g=>!!g&&g.rank!==false;
const loserOf=m=>m.w===m.a?m.b:m.a;
function myActiveMatch(){if(!C.uid||!D.game||D.game.status!=='running')return null;for(const m of Object.values(D.matches))if(m.w==null&&(m.a===C.uid||m.b===C.uid))return m;return null}
function groupsOf(g){return Object.entries((g&&g.groups)||{}).map(([key,gr])=>({key,...gr}))}
function liveMatches(){if(!D.game||D.game.status!=='running')return [];return Object.values(D.matches).filter(m=>m.w==null).sort((x,y)=>(x.lo-y.lo)||(x.i-y.i))}
function totalPlayers(g){const root=g&&g.groups&&g.groups.g;return root&&Array.isArray(root.players)?root.players.length:0}
function placeLabel(lo,n){const hi=lo+n-1;if(n===2)return lo===1?['Final','결승']:[`Places ${lo}–${hi}`,`${lo}·${hi}위전`];return [`Places ${lo}–${hi}`,`${lo}–${hi}위 결정전`]}
function matchLabel(m){if(!Number.isFinite(m.lo)||!Number.isFinite(m.n))return['Match','경기'];const [en,ko]=placeLabel(m.lo,m.n);return [`Round ${(m.r|0)+1} · ${en}`,ko]}
function myOpenGroup(){let best=null;for(const gr of groupsOf(D.game))if(gr.state==='play'&&(gr.players||[]).includes(C.uid)&&(!best||gr.key.length>best.key.length))best=gr;return best}
function byeAutoWatch(){const gr=myOpenGroup();if(!gr||gr.bye!==C.uid)return null;const key=D.tid+':'+gr.key;if(autoWatched[key])return null;const live=liveMatches();if(!live.length)return null;autoWatched[key]=true;return live[0].id}
function planRounds(n){let r=0,k=n;while(k>1){k=Math.ceil(k/2);r++}return{rounds:r}}
const newTid=()=>'t'+Date.now().toString(36);
const plain=o=>JSON.parse(JSON.stringify(o||{}));

function pairGroup(g,key,lo,ps,byes){
  const order=withSeed(hashStr(g.tid+':'+key),()=>shuffle(ps));
  let bye=null;
  if(order.length%2){
    const min=Math.min(...order.map(u=>byes[u]||0));
    const cands=order.filter(u=>(byes[u]||0)===min);
    bye=withSeed(hashStr(g.tid+':bye:'+key),()=>rnd(cands));
    order.splice(order.indexOf(bye),1);
  }
  const mids=[],matches=[];
  for(let i=0;i<order.length;i+=2){
    const mid=`${g.tid}-${key}-m${i/2}`;mids.push(mid);
    matches.push([mid,{tid:g.tid,gk:key,r:key.length-1,i:i/2,lo,n:ps.length,a:order[i],b:order[i+1],w:null,status:'quiz',score:[0,0],types:g.types||ALLTYPES,win:g.win||11,qtime:g.qtime||20,at:Date.now()}]);
  }
  return{mids,bye,matches};
}
async function splitGroup(g,key,gr,ms){
  const winners=ms.map(m=>m.w);if(gr.bye)winners.push(gr.bye);
  const losers=ms.map(loserOf);
  const byes={...(g.byes||{})},up={},newMatches=[];
  up['groups/'+key+'/state']='done';
  for(const [k,lo,ps] of [[key+'w',gr.lo,winners],[key+'l',gr.lo+winners.length,losers]]){
    if(!ps.length)continue;
    if(ps.length===1){up['ranks/'+ps[0]]=lo;continue}
    if(k.endsWith('l')&&!rankOn(g)){ps.forEach(u=>{up['ranks/'+u]=lo});continue}
    const pg=pairGroup(g,k,lo,ps,byes);if(pg.bye)byes[pg.bye]=(byes[pg.bye]||0)+1;
    up['groups/'+k]={lo,n:ps.length,players:ps,mids:pg.mids,bye:pg.bye||null,state:'play'};
    newMatches.push(...pg.matches);
  }
  up.byes=byes;
  for(const [mid,data] of newMatches)await C.db.ref('matches/'+mid).set(data);
  await C.db.ref('game').update(up);
}
function readyGroups(g){return groupsOf(g).filter(gr=>gr.state==='play'&&(gr.mids||[]).every(id=>D.matches[id]&&D.matches[id].w!=null))}
async function hostAdvance(){
  if(!C.isHost||advancing||!C.db)return;
  const g=D.game;if(!g||g.status!=='running'||!g.groups||!D.matchesLoaded)return;
  const ready=readyGroups(g);
  if(ready.length){
    advancing=true;
    try{const gr=ready[0];await splitGroup(plain(g),gr.key,gr,gr.mids.map(id=>D.matches[id]))}
    catch(e){toast('Couldn’t draw the next matches. Try “Draw next matches”. · 다음 경기 생성 실패')}
    finally{advancing=false}
    return;
  }
  const ranks=g.ranks||{},n=totalPlayers(g);
  if(n&&Object.keys(ranks).length>=n&&!groupsOf(g).some(gr=>gr.state==='play')){
    const champ=Object.keys(ranks).find(u=>ranks[u]===1)||null;
    try{await C.db.ref('game').update({status:'done',champion:champ,endedAt:Date.now()})}catch(e){}
  }
}
async function hostStart(){
  const g=D.game,ids=D.players.map(p=>p.uid);
  if(!g||ids.length<2||advancing)return;
  advancing=true;
  try{
    const fresh={...plain(g),status:'running',groups:null,ranks:null,byes:null,champion:null,startedAt:Date.now()};
    const byes={};const pg=pairGroup(fresh,'g',1,ids,byes);if(pg.bye)byes[pg.bye]=1;
    for(const [mid,data] of pg.matches)await C.db.ref('matches/'+mid).set(data);
    fresh.groups={g:{lo:1,n:ids.length,players:ids,mids:pg.mids,bye:pg.bye||null,state:'play'}};fresh.byes=byes;
    await C.db.ref('game').set(fresh);
  }catch(e){toast('Couldn’t start the tournament. · 토너먼트를 시작하지 못했습니다.')}
  finally{advancing=false}
}
async function hostNewLobby(){
  const types=(D.game&&D.game.types)||ALLTYPES;
  try{await C.db.ref().update({game:{tid:newTid(),status:'lobby',types,at:Date.now()},players:null,matches:null,quiz:null,live:null})}catch(e){toast('Couldn’t open the lobby. · 대기실을 열지 못했습니다.')}
}
async function award(mid,side){
  const m=D.matches[mid];if(!m)return;
  try{await C.db.ref('matches/'+mid).update({w:side?m.b:m.a,status:'done',forfeit:true,endedAt:Date.now()})}catch(e){toast('Couldn’t update the match. · 경기 결과를 저장하지 못했습니다.')}
}
async function joinLobby(){
  if(!C.uid||!D.game)return;
  const el=$('#nm');const name=((el&&el.value)||'').trim().replace(/\s+/g,' ').slice(0,20);
  if(!name){toast('Type your name first. · 이름을 입력하세요.');if(el)el.focus();return}

}
async function leaveLobby(uid){try{await C.db.ref('players/'+uid).remove()}catch(e){toast('Couldn’t remove. · 삭제하지 못했습니다.')}}

  if(!C.ready)main=`<section class="panel"><p class="muted">Connecting… · 연결 중</p></section>`;
  else if(C.setup)main=setupView();
  else if(C.fail)main=`<section class="status"><div><h2>Can’t connect · 연결할 수 없습니다</h2><p>${esc(C.fail)}</p><p>Check that Anonymous sign-in is turned on in Firebase Authentication and that the config at the top of the file is correct. · Firebase 익명 로그인 사용 설정과 파일 맨 위 설정값을 확인하세요.</p></div></section>`;
  else if(D.err&&!D.game)main=`<section class="status"><div><h2>The database refused access · 데이터베이스 접근 거부</h2><p>Check the Realtime Database rules from the setup guide. (${esc(D.err)}) · 설정 안내의 보안 규칙을 확인하세요.</p></div></section>`;
  else if(!D.gameLoaded||!D.hostLoaded)main=`<section class="panel"><p class="muted">${D.slow?'The game data can’t be reached yet. Check your connection. · 데이터에 연결할 수 없습니다.':'Loading the tournament… · 불러오는 중'}</p></section>`;
  else if(C.wantHost&&!C.isHost)main=hostClaimView();
  else if(!D.game)main=C.isHost?hostOpenView():`<section class="status"><div><h2>Waiting for your teacher · 선생님을 기다리는 중</h2><p>The lobby opens when your teacher starts a tournament. Keep this page open. · 선생님이 대기실을 열면 참가할 수 있습니다.</p></div></section>`;

function placeOf(u){const r=D.game&&D.game.ranks&&D.game.ranks[u];return Number.isFinite(r)?r:null}

function podium(g){

  const others=top.filter(u=>ranks[u]>1).map(u=>`<p><b>${placeText(ranks[u])}</b> · ${nameSpan(u)}</p>`).join('');
  const mine=placeOf(C.uid);

function liveCard(m){

function matchCard(m){

/* ================= match container ================= */
function openMatch(mid,watch){
  closeMatch();
  const m=D.matches[mid];if(!m){renderHome();return}
  const side=watch?-1:(m.a===C.uid?0:m.b===C.uid?1:-1);
  MV={mid,side,screen:null,q:null,pong:null,room:null,roomP:null,resultAt:0,stW:false};
  if(C.db)MV.room=liveRoom(mid);
  window.scrollTo(0,0);
  matchUpdate();
}
function closeMatch(){
  if(!MV)return;const my=MV;MV=null;
  if(my.q)clearInterval(my.q.tick),clearTimeout(my.q.adv);
  if(my.pong)my.pong.stop();
  if(my.room)my.room.leave().catch(()=>{});
}
function goHome(){closeMatch();renderHome();window.scrollTo(0,0)}
function matchUpdate(){
  const m=D.matches[MV.mid];if(!m){goHome();return}
  const ph=phaseOf(m);
  if(ph==='done')return showScreen('result');
  if(MV.side>=0){
    if(!D.quizLoaded)return showScreen('loading');
    if(!MV.q)initQuiz(m);
    if(MV.q.state==='active')return showScreen('quiz');
    if(ph==='pong'){if(m.status!=='pong'&&!MV.stW){MV.stW=true;writeDoc('matches/'+m.id,{status:'pong'},'update')}return showScreen('pong')}
    return showScreen('wait');
  }
  return showScreen(ph==='pong'?'pong':'watchquiz');
}
function showScreen(name){
  if(MV.screen===name){refreshScreen();return}
  if(MV.pong&&name!=='pong'){MV.pong.stop();MV.pong=null}
  MV.screen=name;
  ({loading:buildLoading,quiz:buildQuiz,wait:buildWait,watchquiz:buildWatchQuiz,pong:buildPong,result:buildResult})[name]();
  paintNames();
}
function refreshScreen(){
  const m=D.matches[MV.mid];if(!m)return;
  if(MV.screen==='quiz'||MV.screen==='wait'||MV.screen==='watchquiz')updatePads(m);
  if(MV.screen==='wait')updateWaitText(m);
  if(MV.screen==='watchquiz'||(MV.screen==='pong'&&MV.side<0))updateSwitcher();
  paintNames();
}
function mhead(m,compact){

  return `<header class="mhead"><div><p class="eyebrow">${lab[0]} · ${lab[1]}${w?' · Watching · 관람 중':''}</p><h2 class="vs"><span class="l">${nameSpan(m.a)}${MV.side===0?' <small>you</small>':''}</span><em>vs</em><span class="r">${nameSpan(m.b)}${MV.side===1?' <small>you</small>':''}</span></h2></div>${w?`<button class="btn sm" id="mback">← Bracket · 대진표</button>`:''}</header>`;
}
function wireBack(){const b=$('#mback');if(b)b.addEventListener('click',goHome)}
function switcherHTML(){

function updateSwitcher(){const s=$('#switch');if(!s)return;const html=switcherHTML();const tmp=document.createElement('div');tmp.innerHTML=html;const n=tmp.firstElementChild;if(n&&n.innerHTML!==s.innerHTML){s.innerHTML=n.innerHTML;wireSwitcher();paintNames()}}

/* ---------- paddle panel ---------- */
function padsHTML(m,title){

function ansOf(m,s){if(MV&&MV.side===s&&MV.q)return MV.q.ans;const d=D.quiz[qid(m.id,s?m.b:m.a)];return (d&&Array.isArray(d.ans))?d.ans:[]}

    const el=$('#pp'+s);if(!el)continue;

}

}
function showQ(){
  const q=MV.q,item=q.qs[q.idx];

  $('#qbox').innerHTML=`<div class="qtop"><span>Question ${q.idx+1} / ${QN} · ${TYPES[item.type][0]}</span><span class="tnum" id="tnum">${Math.round(q.qt/1000)}</span></div>
    <div class="tbar" id="tbarw"><i id="tbar"></i></div>

    <div class="fb" id="fb" hidden></div>`;

}
function answerQ(i){
  const q=MV&&MV.q;if(!q||q.locked||q.state!=='active')return;
  const item=q.qs[q.idx];if(i>=item.options.length)return;
  q.locked=true;clearInterval(q.tick);

  ok?sfx.good():sfx.bad();
  document.querySelectorAll('.qopt').forEach((b,j)=>{b.disabled=true;if(j===item.answer)b.classList.add('right');else if(j===i)b.classList.add('wrong');else b.classList.add('dim')});
  const m=D.matches[MV.mid];
  writeDoc('quiz/'+qid(m.id,C.uid),{tid:m.tid,mid:m.id,uid:C.uid,ans:q.ans.slice(),correct:q.ans.filter(x=>x===1).length,done:q.ans.length>=QN,at:Date.now()});

  const fb=$('#fb');fb.hidden=false;
  fb.innerHTML=`<p class="v ${ok?'ok':'no'}">${ok?`Correct! Paddle ${BTXT} · 정답! 막대 ${BTXT}`:i<0?'Time’s up · 시간 초과':'Not quite · 오답'}</p><p class="ex">${item.explain}</p><button class="btn primary" id="nextq">${last?'Done · 완료':'Next question · 다음 문제'} <kbd>Enter</kbd></button>`;
  const go=()=>{clearTimeout(q.adv);if(!MV||MV.q!==q)return;if(last){q.state='finished';matchUpdate()}else{q.idx++;showQ()}};
  $('#nextq').addEventListener('click',go);q.next=go;

}
document.addEventListener('keydown',e=>{

/* ================= Pong engine =================
   Field 800×600. The player the ball is travelling toward owns it and decides hits with their own paddle.
   Every state carries a server-synced timestamp, so all screens draw the same straight-line flight
   between events; only serves, hits, points, paddle direction changes and a 1 s heartbeat are sent. */
function createPong(o){
  const {a,b,side,room,hts,score0,first,cv,msg,onScore,onOver}=o;
  const W=800,H=600,BS=12,PW=10,AX=36,BX=W-AX-PW,GAP=26,PSPD=620,R=H-BS,WIN=o.win||11;
  const SEG=[-1,-.67,-.33,0,0,.33,.67,1],TIERS=[370,490,630];
  const ctx=cv.getContext('2d');
  const FONT={0:['111','101','101','101','111'],1:['001','001','001','001','001'],2:['111','001','111','100','111'],3:['111','001','111','001','111'],4:['101','101','111','001','001'],5:['111','100','111','001','111'],6:['111','100','111','101','111'],7:['111','001','001','001','001'],8:['111','101','111','101','111'],9:['111','101','111','001','111']};
  const now=()=>Date.now()+(C.off||0);
  let G=null,myY=H/2,myD=0,up=false,dn=false,last=performance.now(),raf=0,stopped=false,both=0,lastOg=null,overDone=false,lastMsg=null,sentD=null,lastPub=0;
  let base=null,err={x:0,y:0},prevShown=null,prevSeg=null;
  const py=[H/2,H/2];
  /* Original Pong steps the speed up on the 4th and 12th hit; after that every hit adds 3% (capped) so a rally can't last forever. */
  const tier=h=>h<4?TIERS[0]:h<12?TIERS[1]:Math.min(900,TIERS[2]*Math.pow(1.03,h-12));
  const cy=(y,hh)=>Math.max(GAP+hh/2,Math.min(H-GAP-hh/2,y));
  const okG=g=>!!g&&typeof g==='object'&&['e','x','y','t'].every(k=>Number.isFinite(g[k]))&&Array.isArray(g.s)&&(g.o===0||g.o===1);
  const copy=g=>({...g,s:[g.s[0]|0,g.s[1]|0]});
  function at(g,T){const c={...g};if(g.ph==='play'){const dt=Math.max(0,Math.min(4,(T-g.t)/1000));c.x=g.x+g.vx*dt;const Y=g.y+g.vy*dt,P=2*R;const y=((Y%P)+P)%P;c.y=y>R?P-y:y;c.seg=Math.floor(Y/R)}return c}
  function pack(g){return{e:g.e,o:g.o,ph:g.ph,x:Math.round(g.x*100)/100,y:Math.round(g.y*100)/100,vx:Math.round(g.vx*100)/100,vy:Math.round(g.vy*100)/100,t:Math.round(g.t),end:Math.round(g.end||0),h:g.h|0,m:g.m|0,s:[g.s[0]|0,g.s[1]|0],w:g.w}}
  function publish(){lastPub=performance.now();sentD=myD;room.presence({side,uid:C.uid,y:Math.round(myY*10)/10,d:myD,t:Math.round(now()),g:G?pack(G):null}).catch(()=>{})}
  function scan(){const out=[null,null];for(const p of room.peers()){if(p.isMe)continue;const pr=p.presence||{};const id=p.by||pr.uid;const s=id===a?0:id===b?1:-1;if(s<0||pr.side!==s)continue;out[s]=p}return out}

  /* ---- owner physics ---- */
  function serve(T0){const sp=TIERS[0];G.ph='play';G.t=T0;G.x=W/2-BS/2;G.y=H*(.2+Math.random()*.6);G.vx=(G.o===0?-1:1)*sp;G.vy=[-.67,-.33,.33,.67][Math.floor(Math.random()*4)]*sp*.9;G.h=0;G.m=0;G.e++;publish()}
  function hit(nx,dir){const hh=hts[side];const rel=(G.y+BS/2-(myY-hh/2))/hh;const seg=Math.max(0,Math.min(7,Math.floor(rel*8)));G.h++;const sp=tier(G.h);
    /* a small random twist on every return breaks repeating corner-to-corner loops when nobody moves */
    let f=SEG[seg]+(Math.random()*2-1)*.15;if(Math.abs(f)<.07)f=(f<0||(f===0&&Math.random()<.5))?-.07:.07;f=Math.max(-1.1,Math.min(1.1,f));
    G.x=nx;G.vx=dir*sp;G.vy=f*sp*.9;G.e++;G.o=1-side;G.m=0;sfx.paddle();publish()}
  function point(to){G.s=[G.s[0],G.s[1]];G.s[to]++;G.e++;G.h=0;G.m=0;G.vx=0;G.vy=0;G.x=W/2-BS/2;G.y=H/2-BS/2;sfx.point();
    if(G.s[to]>=WIN){G.ph='over';G.w=to}else{G.ph='wait';G.end=G.t+1500;G.o=side}publish();onScore(G.s.slice())}
  function step(T){
    if(!G||G.o!==side)return;
    if(G.ph==='count'||G.ph==='wait'){if(T>=G.end)serve(G.end);else return}
    if(G.ph!=='play')return;
    let span=(T-G.t)/1000;if(span<=0)return;if(span>.5){G.t=T-500;span=.5}
    const n=Math.max(1,Math.ceil(span*240)),hs=span/n,hh=hts[side];
    for(let i=0;i<n;i++){
      const px=G.x;G.x+=G.vx*hs;G.y+=G.vy*hs;G.t+=hs*1000;
      if(G.y<0){G.y=-G.y;G.vy=-G.vy;sfx.wall()}else if(G.y>R){G.y=2*R-G.y;G.vy=-G.vy;sfx.wall()}
      const inY=G.y+BS>=myY-hh/2&&G.y<=myY+hh/2;
      if(side===0){const face=AX+PW;if(!G.m&&G.vx<0&&px>=face&&G.x<face){if(inY){hit(face,1);return}G.m=1}if(G.x<-BS){point(1);return}}
      else{const face=BX;if(!G.m&&G.vx>0&&px+BS<=face&&G.x+BS>face){if(inY){hit(face-BS,-1);return}G.m=1}if(G.x>W){point(0);return}}
    }
  }
  function adopt(og){
    if(!G||og.e>G.e){
      const prev=G;G=copy(og);
      if(prev){if(G.h>prev.h&&G.ph==='play')sfx.paddle();if(G.s[0]+G.s[1]>prev.s[0]+prev.s[1])sfx.point()}
      if(G.o===side){step(now());publish()}
    }else if(og.e===G.e&&G.o!==side)G=copy(og);
  }

  /* ---- drawing ---- */
  function num(n,cx,top,cell=12){const s=String(n);const w=s.length*3*cell+(s.length-1)*cell;let x=cx-w/2;for(const ch of s){const g=FONT[ch];if(g)for(let r=0;r<5;r++)for(let c=0;c<3;c++)if(g[r][c]==='1')ctx.fillRect(x+c*cell,top+r*cell,cell,cell);x+=4*cell}}
  function draw(st,T){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';
    for(let y=7;y<H;y+=30)ctx.fillRect(W/2-2,y,4,16);
    const sc=st?st.s:score0;num(sc[0]|0,W/4,28);num(sc[1]|0,W*3/4,28);
    const rem=st&&(st.ph==='count'||st.ph==='wait')?(st.end||0)-T:0;
    let grow=1;if(st&&st.e===0&&st.ph==='count'){const t=Math.max(0,Math.min(1,(3200-rem)/1600));grow=1-Math.pow(1-t,3)}
    for(const s of [0,1]){const hh=BASE+(hts[s]-BASE)*grow;ctx.fillRect(s?BX:AX,cy(py[s],hh)-hh/2,PW,hh)}
    if(st&&st.ph==='play')ctx.fillRect(st.x,st.y,BS,BS);
    if(st&&st.ph==='count'){
      const n=Math.max(1,Math.ceil(rem/1000));ctx.fillStyle='#000';ctx.fillRect(W/2-34,H/2-46,68,92);ctx.fillStyle='#fff';num(n,W/2,H/2-40,16);
      ctx.font='600 22px "IBM Plex Mono", monospace';ctx.textBaseline='middle';
      for(const s of [0,1]){const bonus=Math.round((hts[s]-BASE)/BASE*100);if(bonus>0){ctx.textAlign=s?'right':'left';ctx.fillText('+'+bonus+'%',s?BX-16:AX+PW+16,py[s])}}
    }
  }
  function setMsg(t){if(t!==lastMsg){lastMsg=t;msg.innerHTML=t?`<span>${t}</span>`:''}}

  /* ---- loop ---- */
  function padTarget(p,s,T){const pr=p.presence||{};let y=+pr.y;if(!Number.isFinite(y))return null;const d=+pr.d||0,pt=Number.isFinite(+pr.t)?+pr.t:T;y+=d*PSPD*Math.max(0,Math.min(1.5,(T-pt)/1000));return cy(y,hts[s])}
  function frame(ts){
    if(stopped)return;raf=requestAnimationFrame(frame);
    const dt=Math.min(.05,Math.max(0,(ts-last)/1000));last=ts;
    const T=now(),ps=scan(),k=1-Math.exp(-dt/0.05);
    if(side>=0){
      myD=(dn?1:0)-(up?1:0);myY=cy(myY+myD*PSPD*dt,hts[side]);py[side]=myY;
      const op=ps[1-side];
      if(op){const ty=padTarget(op,1-side,T);if(ty!=null)py[1-side]+=(ty-py[1-side])*k;if(!both)both=ts;const og=op.presence.g;if(og!==lastOg){lastOg=og;if(okG(og))adopt(og)}}else both=0;
      if(!G&&op&&side===first&&ts-both>1500&&!okG(op.presence.g)){G={e:0,o:first,ph:'count',end:T+3200,t:T,x:W/2-BS/2,y:H/2-BS/2,vx:0,vy:0,h:0,m:0,s:[score0[0]|0,score0[1]|0],w:-1};publish()}
      step(T);
      if(myD!==sentD||ts-lastPub>1000)publish();
      if(G&&G.ph==='over'&&!overDone){overDone=true;onOver(G.w,G.s.slice())}
      setMsg(!op?`Waiting for ${esc(nameOf(side?a:b))} to join… · 상대 접속 대기 중`:!G?'Connecting… · 연결 중':'');
    }else{
      let best=null;
      for(const s of [0,1]){const p=ps[s];if(!p)continue;const ty=padTarget(p,s,T);if(ty!=null)py[s]+=(ty-py[s])*k;const g=p.presence.g;if(!okG(g))continue;if(!best||g.e>best.e||(g.e===best.e&&g.o===s))best=g}
      if(best&&best!==lastOg){lastOg=best;G=copy(best)}
      setMsg(!G?'Waiting for the players… · 선수 접속 대기 중':'');
    }
    let st=null;
    if(G)st=(side>=0&&G.o===side)?{...G}:at(G,T);
    if(st&&st.ph==='play'){
      if(G!==base){
        err={x:0,y:0};
        if(prevShown&&prevShown.ph==='play'&&Math.sign(prevShown.vx)===Math.sign(st.vx)){const ex=prevShown.x-st.x,ey=prevShown.y-st.y;if(Math.hypot(ex,ey)<70)err={x:ex,y:ey}}
        base=G;prevSeg=st.seg;
      }else{
        const f=Math.exp(-dt/0.09);err.x*=f;err.y*=f;
        if(side>=0&&G.o!==side&&st.seg!==undefined&&prevSeg!==undefined&&st.seg!==prevSeg)sfx.wall();
        prevSeg=st.seg;
      }
      st.x+=err.x;st.y+=err.y;
    }else{base=G;err={x:0,y:0}}
    prevShown=st;
    draw(st,T);
  }

  /* ---- sizing + input ---- */
  const mq=matchMedia('(max-width:720px), (orientation:portrait) and (max-width:1000px)');
  function fit(){
    const wrap=cv.parentElement.parentElement;const ww=wrap.clientWidth;
    const reserve=(side>=0&&mq.matches)?150:24;
    const avail=Math.max(200,window.innerHeight-Math.max(0,cv.getBoundingClientRect().top)-reserve);
    const w=Math.max(200,Math.floor(Math.min(ww,avail*4/3,1100))),hpx=Math.floor(w*3/4);
    cv.style.width=w+'px';cv.style.height=hpx+'px';
    const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(w*dpr);cv.height=Math.round(hpx*dpr);
    ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);ctx.imageSmoothingEnabled=false;
  }
  const hold=(btn,set)=>{if(!btn)return;const on=e=>{e.preventDefault();ensureAudio();set(true);btn.classList.add('held');try{btn.setPointerCapture(e.pointerId)}catch(err){}};const off=()=>{set(false);btn.classList.remove('held')};btn.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(t=>btn.addEventListener(t,off));btn.addEventListener('contextmenu',e=>e.preventDefault())};
  hold(o.up,v=>{up=v});hold(o.dn,v=>{dn=v});
  const kd=e=>{if(side<0)return;const k=e.key.toLowerCase();if(k==='arrowup'||k==='w'){up=true;e.preventDefault()}else if(k==='arrowdown'||k==='s'){dn=true;e.preventDefault()}};
  const ku=e=>{const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')up=false;else if(k==='arrowdown'||k==='s')dn=false};
  const blur=()=>{up=dn=false;o.up&&o.up.classList.remove('held');o.dn&&o.dn.classList.remove('held')};
  window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);window.addEventListener('blur',blur);window.addEventListener('resize',fit);
  fit();setTimeout(fit,200);
  raf=requestAnimationFrame(frame);
  return{stop(){stopped=true;cancelAnimationFrame(raf);window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);window.removeEventListener('blur',blur);window.removeEventListener('resize',fit);try{room.presence({g:null}).catch(()=>{})}catch(e){}}};
}

boot();
</script>
